[graph]
all-features = false
no-default-features = false

[advisories]
version = 2
ignore = ["RUSTSEC-2023-0071"]

[licenses]
version = 2
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-2-Clause-Views",
  "BSD-3-Clause",
  "BSL-1.0",
  "CC0-1.0",
  "ISC",
  "MIT",
  "MPL-2.0",
  "Unicode-3.0",
  "Zlib",
]
confidence-threshold = 0.8
private = { ignore = true }

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-git = [
  "https://github.com/NikSneMC/entrait",
  "https://github.com/NikSneMC/fromenv",
  "https://github.com/NikSneMC/mobc",
  "https://github.com/NikSneMC/utoipa",
  "https://github.com/fgardt/proc-macro-error-2",
]
